{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD | ООО "Обувь"</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="shortcut icon" href="{% static 'images/Icon.ico' %}">
</head>
<body>
    <nav class="navbar-custom">
        <div class="main-container">
            <div class="d-flex justify-content-between align-items-center">
                    <a href="/"><img src="{% static 'images/Icon.JPG' %}"
                         alt="Логотип ООО Обувь"
                         class="logo-img"
                         width="40"
                         height="40">
                    </a>
                <a class="navbar-brand-custom" href="/">
                    ООО "Обувь" - Товары
                </a>



                <a class="btn-logout" href="{% url 'logout' %}">
                    Выйти
                </a>
            </div>
        </div>
    </nav>


    <form class="form-class">
        {% csrf_token %}
        <div>
                <div class="form-group">
                    <label class="form-label">Артикул</label>
                    <input class="form-control" name="art_name">
                </div>

                <div class="form-group">
                    <label class="form-label">Название</label>
                    <input class="form-control" name="name">
                </div>

                <div class="form-group">
                    <label class="form-label">Единица измерения</label>
                    <input class="form-control" name="unit">
                </div>

                <div class="form-group">
                    <label class="form-label">Цена</label>
                    <input class="form-control" name="price">
                </div>

                <div class="form-group">
                    <label class="form-label">Поставщик</label>
                    <input class="form-control" name="postavshik">
                </div>

                <div class="form-group">
                    <label class="form-label">Производитель</label>
                    <select class="form-select">
                        {% for proizvoditel in proizvoditels %}
                        <option value="{{ proizvoditel.id }}">{{ proizvoditel.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" name="category">Категория</label>
                    <select class="form-select">
                        {% for category in categories %}
                        <option value="{{ category }}">{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Скидка</label>
                    <input class="form-control" name="sale">
                </div>

                <div class="form-group">
                    <label class="form-label">Кол-во на складе</label>
                    <input class="form-control" name="quantity">
                </div>

                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <input class="form-control" name="description">
                </div>

                <div class="form-group">
                    <label class="form-label">Фото</label>
                    <input class="form-control" name="photo" type="file" accept="image/*">
                </div>
            </div>
        <button type="submit">Создать</button>
    </form>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>
</body>
</html>
